{% extends 'base.html' %}
{% block content %}
<div class="container">
  <div class="auth-wrapper">
    <div class="card auth-card">
      <div class="auth-title">ManagerW.S</div>
      <div class="auth-subtitle">Plataforma Elite de Gestión de Créditos</div>

      {% if reset_mode and reset_token %}
      <form method="POST" action="{{ url_for('reset_password', token=reset_token) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Nueva contraseña</label>
        <input name="password" type="password" required minlength="10" autocomplete="new-password" placeholder="Mínimo 10 caracteres">
        <button type="submit" class="btn full">Actualizar contraseña</button>
      </form>
      <div style="text-align:center;margin-top:1rem"><a href="{{ url_for('login') }}">Volver al acceso</a></div>

      {% elif reset_mode %}
      <form method="POST" action="{{ url_for('forgot_password') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Correo electrónico</label>
        <input name="email" type="email" required maxlength="254" autocomplete="email" placeholder="correo@ejemplo.com">
        <button type="submit" class="btn full">Enviar instrucciones</button>
      </form>
      <div style="text-align:center;margin-top:1rem"><a href="{{ url_for('login') }}">Volver al acceso</a></div>

      {% else %}
      <form method="POST" action="{{ url_for('login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Usuario</label>
        <input name="username" required autocomplete="username" placeholder="Su usuario">
        <label>Contraseña</label>
        <input name="password" type="password" required autocomplete="current-password" placeholder="••••••••">
        <button type="submit" class="btn full">Acceder</button>
        <div style="text-align:center;margin-top:.75rem"><a href="{{ url_for('forgot_password') }}">¿Olvidó su contraseña?</a></div>
      </form>

      <div class="divider"></div>

      <h3 style="font-size: 0.9rem; font-weight: 600; margin-bottom: 1rem; text-align: center; color: var(--text-secondary);">
        Crear nueva cuenta
      </h3>

      <form method="POST" action="{{ url_for('register') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Usuario</label>
        <input name="username" required minlength="3" maxlength="80" placeholder="Mínimo 3 caracteres">
        <label>Correo electrónico</label>
        <input name="email" type="email" required maxlength="254" autocomplete="email" placeholder="correo@ejemplo.com">
        <label>Contraseña</label>
        <input name="password" type="password" required minlength="10" autocomplete="new-password" placeholder="Mínimo 10 caracteres">
        <label>Nombre de la empresa</label>
        <input name="organization_name" maxlength="160" placeholder="Mi negocio">
        <label>Tipo de negocio</label>
        <select name="business_type"><option value="lender">Prestamista</option><option value="distributor">Distribuidora</option><option value="hybrid">Ambos</option></select>
        <label>Moneda principal</label>
        <select name="currency">
          <option value="GTQ">Guatemala · Quetzal (Q)</option>
          <option value="USD">Dólar estadounidense ($)</option>
          <option value="HNL">Honduras · Lempira (L)</option>
          <option value="CRC">Costa Rica · Colón (₡)</option>
          <option value="NIO">Nicaragua · Córdoba (C$)</option>
          <option value="MXN">México · Peso ($)</option>
        </select>
        <button type="submit" class="btn secondary full">Registrarme</button>
      </form>
      {% endif %}
    </div>
  </div>
</div>
{% endblock %}
